<svg width="920" height="240" viewBox="0 0 920 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="NeverDrop demo loop: live telemetry, link cut, backfill with zero loss, crash black box">
  <rect width="920" height="240" fill="#F4F8FA"/>
  <rect x="0.5" y="0.5" width="919" height="239" fill="none" stroke="#D3DEE7"/>

  <!-- ===== left: telemetry strip with blackout hole that backfills ===== -->
  <text x="40" y="38" font-family="Menlo, Consolas, monospace" font-size="12" letter-spacing="3" fill="#1F6E93">TELEMETRY · 2,000 bit/s</text>
  <rect x="40" y="52" width="540" height="120" fill="#FBFDFE" stroke="#D3DEE7"/>
  <line x1="40" y1="112" x2="580" y2="112" stroke="#5F7688" stroke-opacity="0.25"/>

  <!-- live trace, drawing itself -->
  <path d="M50,112 C70,92 90,132 110,112 C130,92 150,130 170,110 C190,94 210,128 230,112"
        fill="none" stroke="#1F6E93" stroke-width="2.5" stroke-linecap="round"
        stroke-dasharray="300" stroke-dashoffset="300">
    <animate attributeName="stroke-dashoffset" values="300;0;0;0;0;300" keyTimes="0;0.22;0.5;0.8;0.98;1" dur="12s" repeatCount="indefinite"/>
  </path>

  <!-- the hole (blackout window) -->
  <rect x="230" y="56" width="130" height="112" fill="#D42B1E" fill-opacity="0">
    <animate attributeName="fill-opacity" values="0;0;0.08;0.08;0;0" keyTimes="0;0.24;0.28;0.55;0.62;1" dur="12s" repeatCount="indefinite"/>
  </rect>
  <text x="295" y="118" font-family="Menlo, Consolas, monospace" font-size="11" fill="#D42B1E" text-anchor="middle" opacity="0">
    LINK CUT
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.29;0.53;0.6;1" dur="12s" repeatCount="indefinite"/>
  </text>

  <!-- backfill trace sweeps in green -->
  <path d="M230,112 C250,90 270,134 290,112 C310,92 330,132 350,112"
        fill="none" stroke="#0E8F63" stroke-width="2.5" stroke-linecap="round"
        stroke-dasharray="160" stroke-dashoffset="160">
    <animate attributeName="stroke-dashoffset" values="160;160;160;0;0;160" keyTimes="0;0.55;0.62;0.72;0.98;1" dur="12s" repeatCount="indefinite"/>
  </path>
  <!-- live continues after restore -->
  <path d="M350,112 C370,94 390,130 410,110 C430,92 450,128 470,112 C490,96 510,126 530,110 C550,96 565,120 572,112"
        fill="none" stroke="#1F6E93" stroke-width="2.5" stroke-linecap="round"
        stroke-dasharray="360" stroke-dashoffset="360">
    <animate attributeName="stroke-dashoffset" values="360;360;360;0;0;360" keyTimes="0;0.55;0.6;0.82;0.98;1" dur="12s" repeatCount="indefinite"/>
  </path>

  <!-- 0 LOST stamp -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;0;1;1;0" keyTimes="0;0.7;0.74;0.78;0.96;1" dur="12s" repeatCount="indefinite"/>
    <rect x="238" y="66" width="118" height="26" fill="#0E8F63"/>
    <text x="297" y="84" font-family="Menlo, Consolas, monospace" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">0 LOST</text>
  </g>

  <text x="40" y="196" font-family="Menlo, Consolas, monospace" font-size="11.5" fill="#5F7688">cut the link → the robot buffers onboard → restore → the hole closes itself</text>

  <!-- ===== right: the robot, live twin -> crash ===== -->
  <text x="640" y="38" font-family="Menlo, Consolas, monospace" font-size="12" letter-spacing="3" fill="#1F6E93">LIVE TWIN</text>
  <line x1="620" y1="172" x2="900" y2="172" stroke="#C9D8E2" stroke-width="2"/>

  <!-- impact flash -->
  <circle cx="762" cy="168" r="52" fill="#E63B23" opacity="0">
    <animate attributeName="opacity" values="0;0;0;0.45;0;0" keyTimes="0;0.82;0.84;0.86;0.92;1" dur="12s" repeatCount="indefinite"/>
  </circle>

  <!-- robot: sways gently, then tips at the crash beat -->
  <g>
    <animateTransform attributeName="transform" type="rotate"
      values="-4 745 172; 4 745 172; -4 745 172; 3 745 172; 88 745 172; 88 745 172; -4 745 172"
      keyTimes="0; 0.2; 0.45; 0.8; 0.86; 0.97; 1" dur="12s" repeatCount="indefinite"/>
    <rect x="728" y="60" width="26" height="17" fill="#E63B23"/>
    <rect x="748" y="64" width="8" height="6" fill="#18232E"/>
    <rect x="723" y="79" width="36" height="42" fill="#2B3947"/>
    <rect x="713" y="81" width="9" height="28" fill="#18232E"/>
    <rect x="760" y="81" width="9" height="28" fill="#18232E"/>
    <rect x="727" y="121" width="11" height="36" fill="#2B3947"/>
    <rect x="744" y="121" width="11" height="36" fill="#2B3947"/>
    <rect x="723" y="157" width="17" height="9" fill="#E63B23"/>
    <rect x="742" y="157" width="17" height="9" fill="#E63B23"/>
  </g>

  <!-- g-force callout at impact -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;0;1;1;0" keyTimes="0;0.84;0.86;0.88;0.97;1" dur="12s" repeatCount="indefinite"/>
    <rect x="806" y="76" width="86" height="46" fill="#FBFDFE" stroke="#D42B1E"/>
    <text x="849" y="98" font-family="'Arial Black', Arial, sans-serif" font-size="19" font-weight="900" fill="#D42B1E" text-anchor="middle">10.8 g</text>
    <text x="849" y="114" font-family="Menlo, Consolas, monospace" font-size="9" fill="#5F7688" text-anchor="middle">BLACK BOX SENT</text>
  </g>

  <text x="640" y="196" font-family="Menlo, Consolas, monospace" font-size="11.5" fill="#5F7688">crash → last 10 s burst home → 3D replay + root cause</text>

  <text x="460" y="226" font-family="Menlo, Consolas, monospace" font-size="10.5" fill="#8CA1B1" text-anchor="middle">— every byte crosses a genuinely rate-limited 2 kbps link as 340-byte Iridium SBD packets —</text>
</svg>
